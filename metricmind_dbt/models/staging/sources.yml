version: 2

sources:
  - name: raw
    description: "Raw MetricMind sales data loaded from PostgreSQL"
    schema: public
    tables:
      - name: sales_data
        description: "Cleaned 21-column MetricMind sales dataset"
        columns:
          - name: order_id
            description: "Unique identifier for each sales order"
            tests:
              - not_null
              - unique

          - name: order_date
            description: "Date when the order was placed"

          - name: ship_date
            description: "Date when the order was shipped"

          - name: total_revenue
            description: "Revenue generated by the order"

          - name: total_cost
            description: "Cost associated with the order"

          - name: total_profit
            description: "Profit generated by the order"